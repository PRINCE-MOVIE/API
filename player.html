<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0f">
  <meta name="description" content="Regardez votre sélection sur PlayBox.">
  <title>Lecture — PlayBox</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body data-page="player">
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <header class="topbar player-topbar">
    <a class="brand" href="index.html" aria-label="PlayBox, accueil">
      <img class="brand-mark" src="playbox-logo.svg" alt="">
      <span class="brand-word">Play<span>Box</span></span>
    </a>
    <a class="back-button" href="index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h12"/></svg>
      <span>Retour à l’accueil</span>
    </a>
  </header>
  <main class="watch-page">
    <div class="watch-heading">
      <div>
        <p class="eyebrow"><span class="live-dot"></span> PLAYBOX PLAYER</p>
        <h1 id="player-title">Chargement…</h1>
        <p class="watch-subtitle" id="player-subtitle">Votre séance, sans interruption.</p>
      </div>
      <div class="source-status" id="source-status" role="status" aria-live="polite">
        <span class="status-indicator" aria-hidden="true"></span>
        <span id="source-status-text">Préparation du lecteur…</span>
      </div>
    </div>
    <section class="cinema-frame" aria-label="Lecteur vidéo">
      <div class="cinema-empty" id="player-message">
        <div class="cinema-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40"><path d="M17 11.8a2 2 0 0 0-3 1.7v13a2 2 0 0 0 3 1.7l11-6.5a2 2 0 0 0 0-3.4z"/></svg>
        </div>
        <p class="cinema-title">Connexion au lecteur</p>
        <p class="cinema-description" id="player-detail">Choisissez une source pour lancer la lecture.</p>
        <div class="loader-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <iframe id="content-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock" allow="fullscreen" loading="lazy"></iframe>
    </section>
    <div class="watch-toolbar">
      <div class="source-note"><span class="status-indicator" aria-hidden="true"></span><span id="source-note">Sélectionnez une source de lecture</span></div>
      <div class="player-controls">
        <div class="source-controls">
          <label for="node-selector">Source</label>
          <select id="node-selector" aria-label="Choisir une source" disabled>
            <option value="">Chargement…</option>
          </select>
        </div>
        <div class="episode-controls" id="episode-controls" hidden>
          <label for="season-select">Saison</label>
          <select id="season-select" disabled aria-label="Choisir une saison">
            <option value="">Chargement…</option>
          </select>
          <label for="episode-select">Épisode</label>
          <select id="episode-select" disabled aria-label="Choisir un épisode">
            <option value="">Chargement…</option>
          </select>
          <button class="button button-primary" id="load-episode" type="button" disabled>Lire l’épisode</button>
        </div>
      </div>
    </div>
  </main>
  <footer class="footer watch-footer">
    <a class="brand brand-small" href="index.html" aria-label="PlayBox, accueil">
      <img class="brand-mark" src="playbox-logo.svg" alt="">
      <span class="brand-word">Play<span>Box</span></span>
    </a>
    <p>Votre prochain épisode vous attend.</p>
    <span>PLAYBOX PLAYER</span>
  </footer>
</body>
</html>
