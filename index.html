<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060919">
  <meta name="description" content="PRINCE MOVIE : films et séries en français, à regarder où que vous soyez.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="PRINCE MOVIE">
  <meta property="og:description" content="Films et séries en français, à regarder où que vous soyez.">
  <meta property="og:image" content="logo-512.png">
  <title>PRINCE MOVIE — Films et séries en français</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="logo-192.png">
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Cinzel:wght@600;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <script>try{if(sessionStorage.getItem("prince:splash-seen")==="1")document.documentElement.classList.add("no-splash")}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="splash-screen" id="splash-screen" role="status" aria-live="polite" aria-label="Chargement de PRINCE MOVIE">
    <div class="splash-content">
      <img class="splash-logo" src="logo.svg" alt="" width="104" height="104">
      <span class="splash-brand"><b>PRINCE</b> <span class="movie">M<i>O</i>VIE</span></span>
      <span class="splash-spinner" aria-hidden="true"></span>
    </div>
  </div>

  <header class="topbar" data-app-content inert aria-hidden="true">
    <a class="brand" href="index.html" aria-label="PRINCE MOVIE, accueil">
      <img class="brand-mark" src="logo.svg" alt="" width="40" height="40">
      <span class="brand-word"><b>PRINCE</b> <span class="movie">M<i>O</i>VIE</span></span>
    </a>
    <nav class="main-nav" aria-label="Navigation principale">
      <button class="nav-link is-active" data-view="home" type="button">Accueil</button>
      <button class="nav-link" data-view="movie" type="button">Films</button>
      <button class="nav-link" data-view="tv" type="button">Séries</button>
    </nav>
    <form class="search-form" role="search">
      <label class="sr-only" for="search-input">Rechercher un film ou une série</label>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.5 4.5"></path></svg>
      <input id="search-input" type="search" placeholder="Rechercher un titre" autocomplete="off">
      <button class="clear-search" type="button" aria-label="Effacer la recherche" hidden>×</button>
    </form>
  </header>

  <main data-app-content inert aria-hidden="true">
    <h1 class="sr-only">PRINCE MOVI</h1>

    <section class="billboard" id="billboard" aria-labelledby="billboard-title">
      <div class="billboard-media" id="billboard-media" aria-hidden="true"></div>
      <div class="billboard-copy">
        <div class="billboard-meta" id="billboard-meta"></div>
        <h2 id="billboard-title">Films et séries en français</h2>
        <p class="billboard-overview" id="billboard-overview">Choisissez un titre et lancez la lecture en un clic.</p>
        <div class="billboard-actions">
          <button class="button button-primary" id="billboard-play" type="button" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"></path></svg>
            Regarder
          </button>
          <button class="button button-ghost" id="explore-button" type="button">Parcourir le catalogue</button>
        </div>
      </div>
    </section>

    <div class="shell">
      <div class="catalogue-heading">
        <h2 id="section-title">Tendances de la semaine</h2>
        <span class="catalogue-count" id="catalogue-count"></span>
      </div>
      <div class="notice" id="status-message" role="status" aria-live="polite" hidden></div>
      <section class="catalogue" id="catalogue" aria-label="Catalogue de films et séries"></section>
    </div>
  </main>

  <footer class="footer" data-app-content inert aria-hidden="true">
    <a class="brand brand-small" href="index.html" aria-label="PRINCE MOVIE, accueil">
      <img class="brand-mark" src="logo.svg" alt="" width="30" height="30">
      <span class="brand-word"><b>PRINCE</b> <span class="movie">M<i>O</i>VIE</span></span>
    </a>
    <p>Films et séries en français. Les vidéos sont diffusées par des services tiers.</p>
    <p class="footer-credit">Créé par <strong>Prince Tech</strong></p>
  </footer>
</body>
</html>
