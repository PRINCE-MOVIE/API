<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Lisez vos mangas en ligne sur PRINCE MOVIE, avec MangaDex.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Manga — PRINCE MOVIE</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="logo-192.png">
  <link rel="preconnect" href="https://api.mangadex.org">
  <link rel="preconnect" href="https://uploads.mangadex.org">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="mangadex.js" defer></script>
</head>
<body data-page="manga" data-view="manga">
  <header class="topbar player-topbar">
    <a class="brand" href="index.html" aria-label="PRINCE MOVIE, accueil">
      <img class="brand-logo" src="logo-full.svg" alt="" width="151" height="48">
    </a>
    <a class="back-button" href="index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      <span>Retour</span>
    </a>
  </header>

  <main class="manga-page">
    <section class="manga-hero" aria-labelledby="manga-title">
      <div class="manga-backdrop" id="manga-backdrop" aria-hidden="true"></div>
      <div class="manga-hero-inner">
        <img class="manga-cover" id="manga-cover" alt="" width="240" height="360" referrerpolicy="no-referrer" hidden>
        <div class="manga-info">
          <h1 id="manga-title">Chargement…</h1>
          <div class="manga-meta" id="manga-meta"></div>
          <p class="manga-genres" id="manga-genres" hidden></p>
          <p class="manga-synopsis" id="manga-synopsis"></p>
          <button class="manga-more" id="manga-more" type="button" aria-expanded="false" hidden>Lire la suite</button>
        </div>
      </div>
    </section>

    <section class="manga-controls" aria-label="Réglages de lecture">
      <div class="control-grid">
        <div class="field">
          <label for="manga-lang">Langue</label>
          <select id="manga-lang" disabled><option value="">Chargement…</option></select>
        </div>
        <div class="field field-wide">
          <label for="manga-chapter">Chapitre</label>
          <select id="manga-chapter" disabled><option value="">Chargement…</option></select>
        </div>
        <div class="field">
          <label for="manga-quality">Qualité des images</label>
          <select id="manga-quality">
            <option value="data">Haute qualité</option>
            <option value="data-saver">Économie de données</option>
          </select>
        </div>
        <div class="manga-steps">
          <button class="button button-ghost button-small" id="manga-prev" type="button" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-stroke"><path d="m15 18-6-6 6-6"/></svg>
            Précédent
          </button>
          <button class="button button-ghost button-small" id="manga-next" type="button" disabled>
            Suivant
            <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-stroke"><path d="m9 6 6 6-6 6"/></svg>
          </button>
        </div>
      </div>
      <p class="manga-status" id="manga-status" role="status" aria-live="polite">Préparation de la lecture…</p>
    </section>

    <section class="reader" id="reader" aria-label="Lecteur de manga">
      <div class="reader-message" id="reader-message">
        <p class="cinema-title" id="reader-message-title">Chargement du manga</p>
        <p class="cinema-description" id="reader-message-text">Récupération de la fiche depuis MangaDex…</p>
        <div class="loader-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <button class="button button-primary" id="manga-start" type="button" hidden>Commencer</button>
      </div>
      <div class="reader-pages" id="reader-pages" hidden></div>
      <div class="reader-footer" id="reader-footer" hidden>
        <p class="reader-footer-info" id="reader-footer-info"></p>
        <button class="button button-primary" id="reader-next" type="button">Chapitre suivant</button>
      </div>
    </section>
  </main>

  <footer class="footer watch-footer">
    <p>Les mangas sont fournis par MangaDex, une plateforme de lecture communautaire.</p>
    <p class="footer-credit">Créé par Prince Tech</p>
  </footer>
</body>
</html>
