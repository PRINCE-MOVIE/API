<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PRINCE MOVIE" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="pm-bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#14141A"/>
      <stop offset="0.6" stop-color="#050507"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="pm-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2C45C" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F2C45C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pm-gold" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFF6D6"/>
      <stop offset="0.3" stop-color="#F8D775"/>
      <stop offset="0.65" stop-color="#D9A33B"/>
      <stop offset="1" stop-color="#8F5E16"/>
    </linearGradient>
    <linearGradient id="pm-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6D27A" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#B9822A" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="pm-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5C78"/>
      <stop offset="1" stop-color="#C71538"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#pm-bg)"/>
  <circle cx="256" cy="256" r="230" fill="url(#pm-glow)"/>
  <rect x="13" y="13" width="486" height="486" rx="104" fill="none" stroke="url(#pm-ring)" stroke-width="3"/>
  <rect x="30" y="30" width="452" height="452" rx="90" fill="none" stroke="#F2C45C" stroke-opacity=".14" stroke-width="1.5"/>

  <g transform="translate(-4 0)">
    <!-- Le P : empattements, fût épais, panse généreuse -->
    <path fill="url(#pm-gold)" fill-rule="evenodd"
          d="M120 104 H280 C352 104 398 146 398 206 C398 266 352 308 280 308 H240 V374 H292 V404 H120 V374 H174 V134 H120 Z
             M240 150 H276 C316 150 338 172 338 206 C338 240 316 262 276 262 H240 Z"/>
    <!-- Reflet sur le fût -->
    <path d="M186 140 V368" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="5" stroke-linecap="round"/>
    <!-- Bouton lecture dans la panse -->
    <path d="M262 180 L308 206 L262 232 Z" fill="url(#pm-red)" stroke="url(#pm-red)" stroke-width="12" stroke-linejoin="round"/>
  </g>
