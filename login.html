<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08040f">
  <title>Connexion — PRINCE MOVIE</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
  <script src="config.js" defer></script>
  <script src="auth.js" defer></script>
  <script src="login.js" defer></script>
</head>
<body class="login-body">
  <div class="wall" id="wall" aria-hidden="true"></div>
  <div class="orb orb-a" aria-hidden="true"></div><div class="orb orb-b" aria-hidden="true"></div>

  <main class="stage">
    <img class="stage-logo" src="logo-full.svg" alt="PRINCE MOVIE" width="200" height="64">

    <!-- Étape 1 : connexion / inscription / compte oublié -->
    <section class="card" id="step-auth" hidden>
      <div id="auth-main">
        <h1>Films et séries, sans limites.</h1>
        <p class="lead">Connectez-vous pour continuer.</p>
        <div class="tabs" role="tablist">
          <button class="tab-btn is-active" type="button" data-mode="login" role="tab">Connexion</button>
          <button class="tab-btn" type="button" data-mode="signup" role="tab">Inscription</button>
        </div>
        <form id="auth-form" novalidate>
          <label class="f f-name" hidden><span>Nom d’utilisateur</span><input id="f-name" type="text" autocomplete="nickname" maxlength="24"></label>
          <label class="f"><span>Adresse e-mail</span><input id="f-email" type="email" autocomplete="email" required></label>
          <label class="f"><span>Mot de passe</span>
            <span class="pw"><input id="f-pw" type="password" autocomplete="current-password" required><button type="button" class="eye" id="eye" aria-label="👁">👁</button></span>
          </label>
          <p class="msg" id="auth-msg" role="alert" hidden></p>
          <button class="cta" id="auth-submit" type="submit">Se connecter</button>
        </form>
        <button class="link" id="forgot" type="button">Mot de passe oublié ?</button>
      </div>
      <form id="reset-form" hidden novalidate>
        <h1>Retrouver mon compte</h1>
        <p class="lead">Saisissez l’e-mail de votre compte : nous vous envoyons un lien pour choisir un nouveau mot de passe.</p>
        <label class="f"><span>Adresse e-mail</span><input id="r-email" type="email" autocomplete="email" required></label>
        <p class="msg" id="reset-msg" role="alert" hidden></p>
        <button class="cta" type="submit">Envoyer le lien</button>
        <button class="link" id="back-login" type="button">Retour à la connexion</button>
      </form>
    </section>

    <!-- Étape 2 : langue -->
    <section class="card card-wide" id="step-language" hidden>
      <h1>Choisissez votre langue</h1>
      <p class="lead">Le site s’affichera dans la langue choisie.</p>
      <div class="lang-grid" id="lang-grid"></div>
      <button class="cta" id="lang-next" type="button" disabled>Continuer</button>
    </section>

    <!-- Étape 3 : profil -->
    <section class="card card-wide" id="step-profile" hidden>
      <h1>Qui regarde ?</h1>
      <p class="lead">Choisissez votre profil</p>
      <div class="tabs" role="tablist">
        <button class="tab-btn is-active" type="button" data-kind="anime" role="tab">Personnages d’animé</button>
        <button class="tab-btn" type="button" data-kind="stars" role="tab">Stars du cinéma</button>
      </div>
      <div class="profile-grid" id="profile-grid"></div>
      <button class="cta" id="profile-next" type="button" disabled>Commencer</button>
    </section>
  </main>
</body>
</html>
