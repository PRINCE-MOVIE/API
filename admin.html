<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08040f">
  <title>Espace propriétaire — PRINCE MOVIE</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&display=swap">
  <link rel="stylesheet" href="style.css?v=4">
  <link rel="stylesheet" href="login.css?v=4">
  <script src="config.js?v=4" defer></script>
  <script src="auth.js?v=4" defer></script>
  <script src="admin.js?v=4" defer></script>
  <style>.ic{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em;color:#c79bff}
    .adm{max-width:1080px;margin:0 auto;padding:28px 16px 60px}
    .adm header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
    .adm h1{margin:0;font-size:28px;color:#fff}.adm h2{margin:0 0 12px;font-size:17px;color:#fff}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
    .stat,.panel{padding:16px;border-radius:18px;background:linear-gradient(160deg,rgba(40,20,75,.6),rgba(12,6,22,.85));border:1px solid rgba(190,140,255,.2)}
    .stat b{display:block;font-size:34px;color:#fff;line-height:1.1}.stat small{color:var(--muted)}
    .panel{margin-bottom:16px}.panel input[type=text],.panel input[type=search]{width:100%;padding:12px 16px;border-radius:999px;border:1px solid rgba(190,140,255,.2);background:#150c24;color:#fff}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>input{flex:1;min-width:200px}
    .b{padding:10px 16px;border:0;border-radius:999px;font-weight:800;color:#fff;background:linear-gradient(135deg,#a56bff,#6d28d9)}
    .b.ghost{background:#241545}.b.red{background:#b3243f}.b.sm{padding:6px 12px;font-size:12px}
    .tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:#b9a3e6;font-size:12px;text-transform:uppercase}
    .tag{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:800;background:#2a1a4a;color:#e9d5ff}.tag.off{background:#4a1a2a;color:#ffd0e0}
  </style>
</head>
<body>
<div class="adm">
  <header><h1><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4.500 4L12 5l4.500 7L21 8l-2 11H5L3 8Z"/></svg> Espace propriétaire</h1><a class="b ghost" href="index.html">← Retour au site</a></header>
  <div class="stats" id="stats"></div>
  <section class="panel">
    <h2><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.500"/><path d="M2.500 20c.5-3.500 3.200-5.500 6.500-5.500s6 2 6.500 5.500"/><path d="M16 4.500a3.500 3.500 0 0 1 0 7M18 14.800c2 .7 3.200 2.400 3.500 5.200"/></svg> Comptes sur cet appareil</h2>
    <div class="row" style="margin-bottom:12px"><input type="search" id="q" placeholder="Rechercher un nom ou un e-mail"><button class="b ghost" id="csv">Exporter en CSV</button></div>
    <div class="tbl"><table><thead><tr><th>Nom</th><th>E-mail</th><th>Inscrit le</th><th>Vu le</th><th>État</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
</div>
</body>
</html>
